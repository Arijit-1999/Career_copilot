[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "career-copilot"
version = "0.1.0"
description = "Personal AI Career Assistant"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Career Copilot Team" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic[email]>=2.6.0",
    "email-validator>=2.0.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.28",
    "greenlet>=3.0.0",
    "alembic>=1.13.1",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.2.5",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "structlog>=24.1.0",
    "rich>=13.7.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "pytest-cov>=4.1.0",
    "aiosqlite>=0.20.0",
    "ruff>=0.3.0",
    "black>=24.2.0"
]
llm = [
    "google-genai>=0.1.1",
    "openai>=1.13.3",
    "tiktoken>=0.6.0"
]
browser = [
    "playwright>=1.42.0",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.1.0"
]
all = [
    "career-copilot[dev,llm,browser]"
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = [
    "backend/tests"
]
asyncio_mode = "auto"
pythonpath = [
    "backend"
]
markers = [
    "browser: marks tests that require a real Playwright browser binary (deselect with '-m not browser')"
]

[tool.ruff]
line-length = 100
target-version = "py311"
